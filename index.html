<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deep Sea Hunter - Fishing Arcade Game</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(180deg, #001428 0%, #002851 50%, #001428 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        
        #game-canvas {
            display: block;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.3);
        }
        
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 100;
        }
        
        .ui-panel {
            background: rgba(0, 20, 40, 0.85);
            border: 2px solid rgba(0, 150, 255, 0.5);
            border-radius: 8px;
            padding: 10px 15px;
            color: #fff;
            pointer-events: auto;
        }
        
        #coin-display {
            font-size: 18px;
            font-weight: bold;
        }
        
        #coin-display span {
            color: #ffd700;
        }
        
        #bullet-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        #bullet-level-display {
            font-size: 16px;
            color: #00ffff;
        }
        
        .bullet-buttons {
            display: flex;
            gap: 5px;
        }
        
        .bullet-btn {
            width: 36px;
            height: 36px;
            border: 2px solid #00aaff;
            background: rgba(0, 100, 200, 0.5);
            color: #fff;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .bullet-btn:hover {
            background: rgba(0, 150, 255, 0.8);
            transform: scale(1.1);
        }
        
        .bullet-btn.active {
            background: #00aaff;
            border-color: #fff;
        }
        
        #bonus-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00aaff;
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            text-align: center;
        }
        
        #bonus-indicator.active {
            animation: bonusPulse 0.5s ease-out;
        }
        
        @keyframes bonusPulse {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        
        /* Mobile responsive */
        @media (max-width: 768px) {
            #ui-overlay {
                top: 5px;
                left: 5px;
                right: 5px;
            }
            
            .ui-panel {
                padding: 6px 10px;
            }
            
            #coin-display {
                font-size: 14px;
            }
            
            #bullet-level-display {
                font-size: 12px;
            }
            
            .bullet-btn {
                width: 28px;
                height: 28px;
                font-size: 12px;
            }
            
            #bonus-indicator {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay">
            <div class="ui-panel" id="coin-display">
                Coins: <span id="coin-value">1000</span>
            </div>
            <div class="ui-panel" id="bullet-controls">
                <div id="bullet-level-display">Bullet: <span id="bullet-level">1</span>x (Cost: <span id="bullet-cost">10</span>)</div>
                <div class="bullet-buttons">
                    <button class="bullet-btn active" data-level="1">1</button>
                    <button class="bullet-btn" data-level="2">2</button>
                    <button class="bullet-btn" data-level="3">3</button>
                    <button class="bullet-btn" data-level="5">5</button>
                    <button class="bullet-btn" data-level="10">10</button>
                </div>
            </div>
        </div>
        <div id="bonus-indicator"></div>
        <div id="game-canvas"></div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
